<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Pen Fight — 8 player desk battle. Flick your pen, knock opponents off the desk!" />
  <meta name="theme-color" content="#1a2332" />
  <title>Pen Fight — 8 Player</title>
  <link rel="stylesheet" href="./src/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>" />
  <style>
    /* Critical CSS for fast first paint */
    body { background: #1a2332; }
    #lobby { opacity: 0; animation: fadeIn 0.4s ease 0.1s forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="lobby"></div>
  <div id="game-canvas"></div>
  <div id="hud"></div>
  <div id="landscape-warning" class="landscape-warning hidden">
    <div class="landscape-warning-content">
      <span class="landscape-warning-icon">&#x1F4F1;&#x27A1;&#xFE0F;</span>
      <p>Rotate your phone to <b>landscape</b> for the best experience</p>
      <p class="landscape-warning-hint">or tap the &#x26F6; button (bottom-right)</p>
      <button id="landscape-warning-dismiss" class="btn btn-secondary">Got it</button>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
